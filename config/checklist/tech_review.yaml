version: "2.0.0"
name: Tableau Dashboard Review - Tech Review
template: "draft Tableau Dashboard Review - [Report Name].xlsx"
standard: "Analytics Tableau Design & Performance Guide, Version 3.0 (29 October 2026)"

answer_column: C
comment_column: D

# Rows 4, 10 and 26 are section headers in the spreadsheet, not questions.
# Questions with no `rules:` entry are not machine-verifiable from workbook XML
# and are reported as MANUAL_REVIEW with the reason recorded.
sheets:
  - sheet: Tech Review
    items:
      - id: TR-05
        section: Design Standards and Best Practices
        cell: B5
        question: Correct template for amp'd request vs general Analytics request
        rules: []
        manual_reason: >
          Requires the original request context, which is not recorded in the
          workbook XML.

      - id: TR-06
        section: Design Standards and Best Practices
        cell: B6
        question: Official logo is in the upper left corner and is visible against background color
        rules: [CTL-STRUCT-002, CTL-STRUCT-003]
        residual: >
          Image content cannot be read from XML. Confirm visually that the logo
          is the correct asset and legible against the background.

      - id: TR-07
        section: Design Standards and Best Practices
        cell: B7
        question: Metadata complete (data update date, dashboard contact, data owner)
        rules: [CTL-CONTENT-001]
        residual: >
          Presence of each label is verified; confirm the update date is current
          and the named contact and owner are correct.

      - id: TR-08
        section: Design Standards and Best Practices
        cell: B8
        question: Arial font used throughout the dashboard. Worksheet titles are Arial Black
        rules: [CTL-TYPO-001]

      - id: TR-09
        section: Design Standards and Best Practices
        cell: B9
        question: Current Cotality branding colors used
        rules: [CTL-COLOR-001]

      - id: TR-11
        section: Design Standards and Best Practices
        cell: B11
        question: No more than 6 views in the dashboard
        rules: [CTL-LAYOUT-003]

      - id: TR-12
        section: Design Standards and Best Practices
        cell: B12
        question: >-
          Effective color usage with 1-2 dominant colors from Cotality primary palette.
          Can be supplemented by Cotality secondary palette and neutrals. User accessibility considered
        rules: [CTL-COLOR-002, CTL-COLOR-003]

      - id: TR-13
        section: Design Standards and Best Practices
        cell: B13
        question: Views are organized by importance (top to bottom, left to right)
        rules: [CTL-STRUCT-004]
        residual: >
          Geometry is checked heuristically; whether the ordering matches
          business importance is a human judgement.

      - id: TR-14
        section: Design Standards and Best Practices
        cell: B14
        question: Minimum of 10px for outer and inner padding between views
        rules: [CTL-LAYOUT-004]

      - id: TR-15
        section: Design Standards and Best Practices
        cell: B15
        question: Text size primarily follows style guide
        rules: [CTL-TYPO-002]

      - id: TR-16
        section: Design Standards and Best Practices
        cell: B16
        question: Consistent font sizes for each text category (dashboard title, chart headings, labels, tooltips)
        rules: [CTL-TYPO-003]

      - id: TR-17
        section: Design Standards and Best Practices
        cell: B17
        question: Charts and tables have unnecessary gridlines and bandings reduced/removed
        rules: [CTL-CHART-001]

      - id: TR-18
        section: Design Standards and Best Practices
        cell: B18
        question: Charts have concise, horizontal axis labels for the x-axis
        rules: [CTL-CHART-002]
        residual: >
          Label and axis settings are checked; visual truncation and overlap can
          only be confirmed on the rendered dashboard.

      - id: TR-19
        section: Design Standards and Best Practices
        cell: B19
        question: Tiled containers primarily used over floating containers
        rules: [CTL-STRUCT-001]

      - id: TR-20
        cell: B20
        question: Do dashboard actions and filters work correctly?
        rules: []
        manual_reason: >
          Runtime behaviour cannot be verified from static XML; test each filter
          and action in Tableau.

      - id: TR-21
        cell: B21
        question: Does the dashboard have directions on interactivity (not including dropdown filters)?
        rules: [CTL-CONTENT-002]
        residual: >
          Presence of instructional text is verified; whether it adequately
          explains every action is a human judgement.

      - id: TR-22
        cell: B22
        question: Are tooltips used effectively with meaningful titles and metrics?
        rules: [CTL-CONTENT-005]
        residual: >
          Raw calculation references are detected; whether a tooltip adds useful
          context is a human judgement.

      - id: TR-23
        cell: B23
        question: Do charts, tables, tooltips and other metrics have business friendly names and are spelled correctly?
        rules: [CTL-CONTENT-003, CTL-CONTENT-004]

      - id: TR-24
        section: Dashboard Performance
        cell: B24
        question: Does the dashboard load in a reasonable timeframe (< 8 seconds)?
        rules: []
        manual_reason: >
          Load time is a runtime measurement and cannot be derived from a static
          workbook file. Measure on Tableau Server or Desktop.

      - id: TR-25
        section: Dashboard Performance
        cell: B25
        question: Run workbook Optimizer. Are the Take Action and Needs Review items addressed?
        rules: [CTL-PERF-001]
        residual: >
          Suppressed Optimizer rules are detected; run the Optimizer in Tableau
          to confirm the remaining items are addressed.

      - id: TR-27
        section: Dashboard Performance
        cell: B27
        question: Limit custom SQL in live connections. Use Tableau relationships where possible
        rules: [CTL-PERF-004]

      - id: TR-28
        section: Dashboard Performance
        cell: B28
        question: Use "Show Apply Button" for multi-select filters
        rules: [CTL-PERF-002]

      - id: TR-29
        section: Dashboard Performance
        cell: B29
        question: Avoid filter lists with many unique values
        rules: [CTL-PERF-003]
        residual: >
          The filter control type is checked. The number of distinct values lives
          in the data extract, not the workbook XML, so cardinality must be
          confirmed in Tableau Desktop.

      - id: TR-30
        section: Dashboard Performance
        cell: B30
        question: Close unneeded sheets and hide sheets that are in use
        rules: [CTL-HYG-001, CTL-HYG-002]
