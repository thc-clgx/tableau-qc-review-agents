version: "2.0.0"
metadata:
  name: Cotality Analytics - typography rules
  standard: "Analytics Tableau Design & Performance Guide, Version 3.0 (29 October 2026)"
  checklist: "draft Tableau Dashboard Review - [Report Name].xlsx / Agent Review"
  owner: "Analytics BI QC"

rules:
  - id: CTL-TYPO-001
    title: Workbook must use the Arial font family
    description: >
      Arial is the standard font for all text; Arial Black is used for
      worksheet titles. Both workbook formatting and formatted text runs are
      checked.
    category: Typography
    scope: workbook
    severity: HIGH
    standard_ref: "Design & Performance Guide v3.0, Typography"
    checklist_ref: "Agent Review!B7"
    tags: [typography, font, branding]
    assertions:
      - field: style.font_families
        operator: all_in
        value:
          - Arial
          - Arial Black
        description: Every declared font-family must be an approved Arial variant
    evidence_fields:
      - style.font_sizes
    treat_empty_as_missing: true
    on_missing: MANUAL_REVIEW
    message_pass: "All declared workbook fonts are approved Arial variants ({observed})."
    message_fail: "Non-approved fonts are declared in the workbook: {observed}."
    message_manual: >
      The workbook XML declares no font-family; Tableau is using its inherited
      default. Confirm in Format > Workbook that Arial is applied.
    recommendation: >
      In Tableau Desktop choose Format > Workbook and set All fonts to Arial,
      then set Worksheet Titles to Arial Black.

  - id: CTL-TYPO-002
    title: Text sizes must follow the style guide size bands
    description: >
      Permitted sizes are dashboard title 24-28, subtitle/chart title 15-16,
      chart header 11-12 and labels/other text 10-11.
    category: Typography
    scope: workbook
    severity: MEDIUM
    standard_ref: "Design & Performance Guide v3.0, Typography size table"
    checklist_ref: "Agent Review!B14"
    tags: [typography, font-size]
    assertions:
      - field: style.font_sizes
        operator: all_in
        value: [10, 11, 12, 15, 16, 24, 25, 26, 27, 28]
        description: Every declared font size must fall in an approved band
    evidence_fields:
      - style.text_categories
    treat_empty_as_missing: true
    on_missing: MANUAL_REVIEW
    message_pass: "All declared text sizes fall within the style guide bands."
    message_fail: "Text sizes outside the style guide bands are used: {observed}."
    message_manual: >
      No font sizes are declared in the workbook XML; confirm text sizing in
      Tableau Desktop.
    recommendation: >
      Set dashboard titles to 24-28pt, chart titles to 15-16pt Arial Black,
      chart headers to 11-12pt and labels/other text to 10-11pt.

  - id: CTL-TYPO-003
    title: Each text category must use a single consistent font size
    description: >
      The guide asks for the same font size within each category of text
      (dashboard title, chart heading, label, tooltip).
    category: Typography
    scope: workbook
    severity: MEDIUM
    standard_ref: "Design & Performance Guide v3.0, Typography"
    checklist_ref: "Agent Review!B15"
    tags: [typography, consistency]
    applies_when:
      - field: style.text_categories
        operator: is_not_empty
        description: Only assessed when the workbook declares font sizes
    assertions:
      - field: style.inconsistent_text_categories
        operator: is_empty
        description: No text category may declare more than one font size
    evidence_fields:
      - style.text_categories
      - style.font_sizes
    on_missing: MANUAL_REVIEW
    on_violation: ADVISORY
    message_pass: "Every text category uses a single consistent font size."
    message_fail: "These text categories mix several font sizes: {observed}."
    recommendation: >
      Standardise font size, weight and colour within each text category so
      that all chart headers, labels and tooltips match.
