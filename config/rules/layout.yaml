version: "2.0.0"
metadata:
  name: Cotality Analytics - dashboard layout rules
  standard: "Analytics Tableau Design & Performance Guide, Version 3.0 (29 October 2026)"
  checklist: "draft Tableau Dashboard Review - [Report Name].xlsx / Agent Review"
  owner: "Analytics BI QC"

rules:
  - id: CTL-LAYOUT-001
    title: Dashboard width must be 1600 px
    description: >
      Dashboards must use the PowerPoint fixed size of 1600x900 so that the
      published view requires minimal scrolling and renders predictably.
    category: Layout
    scope: dashboard
    severity: HIGH
    standard_ref: "Design & Performance Guide v3.0, Layout - Size"
    # The redesigned review checklist has no dashboard-size question, so this
    # rule intentionally maps to no cell. It is still enforced and appears in
    # the QC Findings tab and the PDF. Add a `checklist_ref` here if a size row
    # is added to the spreadsheet.
    tags: [layout, size, template]
    assertions:
      - field: size.width
        operator: equals
        value: 1600
        description: Fixed dashboard width in pixels
    evidence_fields:
      - size.min_width
      - size.max_width
      - size.is_fixed
    on_missing: MANUAL_REVIEW
    message_pass: "Dashboard '{target_name}' uses the required width of 1600 px."
    message_fail: "Dashboard '{target_name}' is {observed} px wide; the standard requires 1600 px."
    message_manual: "Dashboard '{target_name}' does not declare a fixed width; confirm the size in Tableau Desktop."
    recommendation: >
      Open the dashboard in Tableau Desktop and set Size to Fixed size ->
      PowerPoint (1600 x 900).

  - id: CTL-LAYOUT-002
    title: Dashboard height must be 900 px
    description: >
      Dashboards must use the PowerPoint fixed size of 1600x900 so that the
      published view requires minimal scrolling and renders predictably.
    category: Layout
    scope: dashboard
    severity: HIGH
    standard_ref: "Design & Performance Guide v3.0, Layout - Size"
    # The redesigned review checklist has no dashboard-size question, so this
    # rule intentionally maps to no cell. It is still enforced and appears in
    # the QC Findings tab and the PDF. Add a `checklist_ref` here if a size row
    # is added to the spreadsheet.
    tags: [layout, size, template]
    assertions:
      - field: size.height
        operator: equals
        value: 900
        description: Fixed dashboard height in pixels
    evidence_fields:
      - size.min_height
      - size.max_height
      - size.is_fixed
    on_missing: MANUAL_REVIEW
    message_pass: "Dashboard '{target_name}' uses the required height of 900 px."
    message_fail: "Dashboard '{target_name}' is {observed} px high; the standard requires 900 px."
    message_manual: "Dashboard '{target_name}' does not declare a fixed height; confirm the size in Tableau Desktop."
    recommendation: >
      Open the dashboard in Tableau Desktop and set Size to Fixed size ->
      PowerPoint (1600 x 900).

  - id: CTL-LAYOUT-003
    title: A dashboard must contain no more than 6 views
    description: >
      More than six worksheet views in a single dashboard harms workbook
      performance and confuses the audience.
    category: Layout
    scope: dashboard
    severity: HIGH
    standard_ref: "Design & Performance Guide v3.0, Dashboard Best Practices - Limit Views to 6 or Fewer"
    checklist_ref: "Agent Review!B10"
    tags: [layout, performance, views]
    assertions:
      - field: view_count
        operator: less_than_or_equal
        value: 6
        description: Number of worksheet view zones placed on the dashboard
    evidence_fields:
      - worksheet_names
      - distinct_view_count
      - filter_count
    on_missing: MANUAL_REVIEW
    message_pass: "Dashboard '{target_name}' contains {observed} views (limit 6)."
    message_fail: "Dashboard '{target_name}' contains {observed} views; the limit is 6."
    recommendation: >
      Reduce the dashboard to at most 6 views. Move secondary analysis onto a
      separate dashboard or combine related worksheets.

  - id: CTL-LAYOUT-004
    title: Dashboard views must use at least 10 px of outer and inner padding
    description: >
      The Analytics template uses 20 px outer padding (minimum 10 px) and
      10-15 px inner padding to separate views.
    category: Layout
    scope: dashboard_view_zone
    severity: MEDIUM
    standard_ref: "Design & Performance Guide v3.0, Layout - Padding"
    checklist_ref: "Agent Review!B13"
    tags: [layout, padding, whitespace]
    applies_when:
      - field: references_worksheet
        operator: is_true
        description: Only zones that embed a worksheet are assessed
    assertions:
      - field: outer_padding.minimum
        operator: greater_than_or_equal
        value: 10
        description: Smallest declared outer padding (margin) in pixels
      - field: inner_padding.minimum
        operator: greater_than_or_equal
        value: 10
        description: Smallest declared inner padding in pixels
    evidence_fields:
      - dashboard_name
      - outer_padding.declared_sides
      - inner_padding.declared_sides
    on_missing: MANUAL_REVIEW
    message_pass: "View zone '{target_name}' meets the 10 px minimum padding requirement."
    message_fail: "View zone '{target_name}' uses {observed} px padding; at least 10 px is required."
    message_manual: "View zone '{target_name}' does not declare padding in the XML; verify padding in Tableau Desktop."
    recommendation: >
      Select the view in the dashboard Layout pane and set outer padding to
      20 px (minimum 10 px) and inner padding to 10-15 px.
