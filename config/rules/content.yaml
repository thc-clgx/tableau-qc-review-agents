version: "1.0.0"
metadata:
  name: Cotality Analytics - content, naming and metadata rules
  standard: "Analytics Tableau Design & Performance Guide, Version 3.0 (29 October 2026)"
  checklist: "draft Tableau Dashboard Review - [Report Name].xlsx / Agent Review"
  owner: "Analytics BI QC"

rules:
  - id: CTL-CONTENT-001
    title: Required metadata elements must be present
    description: >
      Every dashboard must show the data update date, the dashboard contact and
      the data owner in the footer or sidebar.
    category: Content
    scope: workbook
    severity: HIGH
    standard_ref: "Design & Performance Guide v3.0, Layout - Required Dashboard Elements"
    checklist_ref: "Agent Review!B6"
    tags: [metadata, template]
    assertions:
      - field: missing_metadata_elements
        operator: is_empty
        description: Data update date, dashboard contact and data owner labels
    evidence_fields:
      - metadata_elements_present
    on_missing: MANUAL_REVIEW
    message_pass: >
      All required metadata labels are present. Their values cannot be
      validated from XML - confirm the date is current and the contact and
      owner are correct.
    message_fail: "Required metadata elements are missing: {observed}."
    recommendation: >
      Complete the template footer or sidebar with Data Last Updated, Dashboard
      Contact and Data Owner.

  - id: CTL-CONTENT-002
    title: Dashboards must explain how to interact with them
    description: >
      Users should not have to guess. Include text or an information icon
      describing filters, actions and drill-down behaviour.
    category: Content
    scope: workbook
    severity: MEDIUM
    standard_ref: "Design & Performance Guide v3.0, Usability - Provide Clear Instructions"
    checklist_ref: "Agent Review!B19"
    tags: [usability, instructions]
    assertions:
      - field: has_interactivity_instructions
        operator: is_true
        description: Instructional microcopy describing interactivity
    evidence_fields:
      - raw_calculation_text_count
    on_missing: MANUAL_REVIEW
    on_violation: ADVISORY
    message_pass: >
      Instructional text describing interactivity was found. Whether it covers
      every action and drill-down needs a human check.
    message_fail: "No instructional text describing dashboard interactivity was found."
    recommendation: >
      Add a short instruction such as "Select a segment of the donut chart to
      filter the table below", or an information icon with usage guidance.

  - id: CTL-CONTENT-003
    title: Workbook must not contain spelling errors
    description: >
      The guide states the workbook should not have spelling errors. A curated
      list of known domain misspellings is checked so business vocabulary and
      product names are never falsely flagged.
    category: Content
    scope: workbook
    severity: MEDIUM
    standard_ref: "Design & Performance Guide v3.0, Naming and Labeling - Spelling"
    checklist_ref: "Agent Review!B20"
    tags: [naming, spelling]
    assertions:
      - field: misspelled_words
        operator: is_empty
        description: Known misspellings in titles, tooltips, labels and names
    evidence_fields:
      - misspelled_word_count
    on_missing: NOT_APPLICABLE
    message_pass: "No known misspellings were found in workbook text."
    message_fail: "Spelling errors found: {observed}."
    recommendation: >
      Correct the spelling in the affected worksheet titles, tooltips, labels
      and calculated field names.

  - id: CTL-CONTENT-004
    title: Objects must use business-friendly names
    description: >
      Titles, labels and metric names should read in plain language. Raw
      generated calculation ids, '(copy)' suffixes and trailing spaces are not
      business friendly.
    category: Content
    scope: workbook
    severity: MEDIUM
    standard_ref: "Design & Performance Guide v3.0, Naming and Labeling"
    checklist_ref: "Agent Review!B20"
    tags: [naming]
    assertions:
      - field: poorly_named_objects
        operator: is_empty
        description: Worksheet and field names that are not business friendly
    evidence_fields:
      - poorly_named_object_count
    on_missing: NOT_APPLICABLE
    on_violation: ADVISORY
    message_pass: "All worksheet and field names look business friendly."
    message_fail: "{observed} object(s) use technical or duplicated names."
    recommendation: >
      Rename generated calculations and duplicated fields to business terms,
      for example 'Calculation_2211830417016991744' to 'Model Performance
      Status', and remove '(copy)' suffixes and trailing spaces.

  - id: CTL-CONTENT-005
    title: Tooltips must not expose raw calculation references
    description: >
      Tooltips should add context, not surface internal field identifiers or
      blank labels.
    category: Content
    scope: workbook
    severity: MEDIUM
    standard_ref: "Design & Performance Guide v3.0, Usability - Write Effective Tooltips"
    checklist_ref: "Agent Review!B20"
    tags: [tooltip, naming]
    assertions:
      - field: raw_calculation_text_count
        operator: equals
        value: 0
        description: Text blocks containing generated Calculation_ identifiers
    evidence_fields:
      - texts_with_raw_calculations
    on_missing: NOT_APPLICABLE
    on_violation: ADVISORY
    message_pass: "No tooltip or label exposes a raw calculation reference."
    message_fail: "{observed} text block(s) expose raw calculation references."
    recommendation: >
      Give every calculated field a business caption so tooltips and labels
      show readable names, and remove empty tooltip rows.
