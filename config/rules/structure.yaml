version: "1.0.0"
metadata:
  name: Cotality Analytics - dashboard structure and required elements
  standard: "Analytics Tableau Design & Performance Guide, Version 3.0 (29 October 2026)"
  checklist: "draft Tableau Dashboard Review - [Report Name].xlsx / Agent Review"
  owner: "Analytics BI QC"

rules:
  - id: CTL-STRUCT-001
    title: Dashboard components must primarily use tiled containers
    description: >
      Charts, KPIs and filters should sit in tiled containers so the layout
      renders predictably once published.
    category: Structure
    scope: dashboard
    severity: MEDIUM
    standard_ref: "Design & Performance Guide v3.0, Layout - Use Tiled Containers by Default"
    checklist_ref: "Agent Review!B18"
    tags: [layout, structure, floating]
    assertions:
      - field: floating_zone_count
        operator: equals
        value: 0
        description: Dashboard objects positioned outside the tiled layout tree
    evidence_fields:
      - tiled_zone_count
      - floating_ratio
    on_missing: MANUAL_REVIEW
    message_pass: "Dashboard '{target_name}' places every object in tiled containers."
    message_fail: "Dashboard '{target_name}' has {observed} floating object(s)."
    recommendation: >
      Dock floating parameter controls and text objects into the tiled layout
      container so they render predictably when published.

  - id: CTL-STRUCT-002
    title: A logo image must sit in the upper-left corner
    description: >
      Every dashboard requires a logo in the upper-left corner - the amp'd logo
      for amp'd dashboards, the Cotality logomark otherwise.
    category: Structure
    scope: dashboard
    severity: HIGH
    standard_ref: "Design & Performance Guide v3.0, Layout - Required Dashboard Elements"
    checklist_ref: "Agent Review!B5"
    tags: [layout, logo, branding]
    assertions:
      - field: has_upper_left_image
        operator: is_true
        description: An image object must be positioned in the top-left corner
    evidence_fields:
      - image_file_names
    on_missing: MANUAL_REVIEW
    message_pass: >
      Dashboard '{target_name}' places an image in the upper-left corner.
      The image content itself cannot be verified from XML - confirm visually
      that it is the correct, legible logo.
    message_fail: "Dashboard '{target_name}' has no image object in the upper-left corner."
    recommendation: >
      Place the approved logo (amp'd logo for amp'd dashboards, Cotality
      logomark otherwise) in the upper-left corner of the dashboard.

  - id: CTL-STRUCT-003
    title: Dashboard image assets must have meaningful file names
    description: >
      Placeholder asset names such as Untitled.png indicate an unverified or
      temporary image.
    category: Structure
    scope: dashboard_image
    severity: LOW
    standard_ref: "Design & Performance Guide v3.0, Logo"
    checklist_ref: "Agent Review!B5"
    tags: [logo, hygiene]
    assertions:
      - field: file_name
        operator: not_matches
        value: "(?i)^(untitled|image|new|copy|screenshot)"
        description: Placeholder asset file names
    evidence_fields:
      - dashboard_name
      - is_upper_left
    on_missing: MANUAL_REVIEW
    on_violation: ADVISORY
    message_pass: "Image asset '{target_name}' has a meaningful file name."
    message_fail: "Image asset '{target_name}' uses a placeholder file name."
    recommendation: >
      Replace placeholder images with the approved branded asset from
      SharePoint and give the file a descriptive name.

  - id: CTL-STRUCT-004
    title: Views should be ordered with summary metrics above detail
    description: >
      Information should read top to bottom, left to right, with aggregated
      KPIs at the top and granular tables at the bottom.
    category: Structure
    scope: dashboard
    severity: LOW
    standard_ref: "Design & Performance Guide v3.0, Layout - Organize by Importance"
    checklist_ref: "Agent Review!B12"
    tags: [layout, hierarchy]
    assertions:
      - field: largest_view_is_not_first
        operator: is_false
        description: The topmost view should not also be the largest one
    evidence_fields:
      - views_in_reading_order
      - view_count
    on_missing: NOT_APPLICABLE
    on_violation: ADVISORY
    message_pass: >
      Dashboard '{target_name}' leads with compact summary views above larger
      detail views.
    message_fail: >
      Dashboard '{target_name}' places its largest view at the top; confirm
      that aggregated KPIs lead the layout.
    recommendation: >
      Move aggregated KPI views to the top of the dashboard and place granular
      tables and detailed charts below them.
