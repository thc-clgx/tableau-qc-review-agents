version: "1.0.0"
metadata:
  name: Cotality Analytics - performance and workbook hygiene rules
  standard: "Analytics Tableau Design & Performance Guide, Version 3.0 (29 October 2026)"
  checklist: "draft Tableau Dashboard Review - [Report Name].xlsx / Agent Review"
  owner: "Analytics BI QC"

rules:
  - id: CTL-PERF-001
    title: Workbook Optimizer rules must not be suppressed
    description: >
      The guide requires running Workbook Optimizer and addressing Take Action
      and Needs Review items. Suppressed rules hide those findings.
    category: Performance
    scope: workbook
    severity: HIGH
    standard_ref: "Design & Performance Guide v3.0, Performance - Use Workbook Optimizer"
    checklist_ref: "Tech Review!B25"
    tags: [performance, optimizer]
    assertions:
      - field: ignored_optimizer_rules
        operator: is_empty
        description: No Workbook Optimizer rule may be marked ignored
    evidence_fields:
      - ignored_optimizer_rule_count
    on_missing: NOT_APPLICABLE
    message_pass: "No Workbook Optimizer rules are suppressed."
    message_fail: "Workbook Optimizer rules are suppressed: {observed}."
    message_not_applicable: >
      The workbook records no Workbook Optimizer state; run the Optimizer in
      Tableau Desktop.
    recommendation: >
      Re-run Workbook Optimizer, un-ignore the suppressed rules and resolve the
      underlying Take Action and Needs Review items.

  - id: CTL-PERF-002
    title: Multi-select filters must show an Apply button
    description: >
      Enabling the Apply button on multi-select filters prevents a query per
      checkbox click.
    category: Performance
    scope: multi_select_filter_zone
    severity: MEDIUM
    standard_ref: "Design & Performance Guide v3.0, Performance - Optimize Filters"
    checklist_ref: "Agent Review!B23"
    tags: [performance, filters]
    assertions:
      - field: show_apply
        operator: is_true
        description: show-apply must be enabled on multi-select filter controls
    evidence_fields:
      - filter_mode
      - dashboard_name
    on_missing: FAIL
    message_pass: "Multi-select filter '{target_name}' shows the Apply button."
    message_fail: "Multi-select filter '{target_name}' does not show the Apply button."
    recommendation: >
      Select the filter control, open Customize and enable Show Apply Button.

  - id: CTL-PERF-003
    title: Avoid enumerated filter controls for high-cardinality fields
    description: >
      Long checkbox lists render hundreds of items. The guide asks for wildcard
      match or a search box instead.
    category: Performance
    scope: dashboard_filter_zone
    severity: MEDIUM
    standard_ref: "Design & Performance Guide v3.0, Performance - Optimize Filters"
    checklist_ref: "Agent Review!B24"
    tags: [performance, filters]
    applies_when:
      - field: filter_values_source
        operator: equals
        value: database
        description: Only filters bound to the full database domain are assessed
    assertions:
      - field: filter_mode
        operator: not_in
        value: [checklist, multivalue-list]
        description: Fully enumerated list controls are the costly ones
    evidence_fields:
      - filter_mode
      - dashboard_name
    on_missing: MANUAL_REVIEW
    on_violation: ADVISORY
    message_pass: "Filter '{target_name}' does not use a fully enumerated list control."
    message_fail: >
      Filter '{target_name}' uses an enumerated list control bound to the full
      database domain; if the field has many unique values this will render
      slowly.
    recommendation: >
      Switch high-cardinality filters to Wildcard Match or a Custom List search
      control. Note that the number of distinct values lives in the data
      extract, not the workbook XML, so cardinality must be confirmed in
      Tableau Desktop.

  - id: CTL-PERF-004
    title: Avoid custom SQL on live connections
    description: >
      Custom SQL significantly reduces performance on live connections. Native
      relationships or joins should be used instead.
    category: Performance
    scope: workbook
    severity: HIGH
    standard_ref: "Design & Performance Guide v3.0, Performance - Avoid Custom SQL"
    checklist_ref: "Agent Review!B22"
    tags: [performance, sql]
    assertions:
      - field: live_custom_sql_datasources
        operator: is_empty
        description: No live (non-extracted) datasource may use custom SQL
    evidence_fields:
      - uses_custom_sql
    on_missing: MANUAL_REVIEW
    message_pass: "No live connection uses custom SQL."
    message_fail: "These live datasources use custom SQL: {observed}."
    recommendation: >
      Replace custom SQL with Tableau relationships or joins, or move the logic
      into a curated database view. If custom SQL must remain, ensure the
      datasource is extracted.

  - id: CTL-HYG-001
    title: Every worksheet must be used by a dashboard
    description: >
      The guide requires hiding all worksheets used in a dashboard and deleting
      any sheet that is not used.
    category: Hygiene
    scope: workbook
    severity: MEDIUM
    standard_ref: "Design & Performance Guide v3.0, Dashboard Best Practices - Hide Unused Sheets"
    checklist_ref: "Agent Review!B25"
    tags: [hygiene, sheets]
    assertions:
      - field: unused_worksheet_count
        operator: equals
        value: 0
        description: Worksheets not placed on any dashboard should be deleted
    evidence_fields:
      - worksheet_count
      - hidden_worksheet_count
    on_missing: MANUAL_REVIEW
    message_pass: "Every worksheet is used by a dashboard."
    message_fail: "{observed} worksheet(s) are not used by any dashboard."
    recommendation: >
      Delete worksheets that are not used in any dashboard, and hide the
      worksheets that are in use.

  - id: CTL-HYG-002
    title: Worksheets used in dashboards must be hidden
    description: >
      Sheets that feed a dashboard should be hidden so the published workbook
      shows only dashboards.
    category: Hygiene
    scope: used_worksheet
    severity: LOW
    standard_ref: "Design & Performance Guide v3.0, Dashboard Best Practices - Hide Unused Sheets"
    checklist_ref: "Agent Review!B25"
    tags: [hygiene, sheets]
    assertions:
      - field: is_visible
        operator: is_false
        description: A worksheet used in a dashboard should not also be visible
    evidence_fields:
      - used_in_dashboards
    on_missing: MANUAL_REVIEW
    message_pass: "Worksheet '{target_name}' is hidden."
    message_fail: "Worksheet '{target_name}' is used in a dashboard but is not hidden."
    recommendation: >
      Right-click the worksheet tab and choose Hide.
